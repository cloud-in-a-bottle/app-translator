[project]
name = "app-translator"
version = "0.1.0"
description = "Translate deployment configs from other platforms into installable OpenHost apps"
requires-python = ">=3.12"
dependencies = [
    "attrs",
    "httpx",
    "hypercorn",
    "jinja2",
    "litestar>=2.21.1,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "mypy", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app_translator"]

[tool.ruff]
line-length = 119

[tool.ruff.lint.isort]
force-single-line = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.mypy]
python_version = "3.12"
strict = true
